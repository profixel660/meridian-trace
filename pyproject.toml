[project]
name = "meridian"
version = "0.2.0a1"
description = "Meridian — per-trade deliverables register from heterogeneous construction project documents."
readme = "CONTEXT.md"
requires-python = ">=3.12"
authors = [
    { name = "T-Bionic" },
]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "litellm>=1.52",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "extract-msg>=0.50",
    "typer>=0.14",
    "rich>=13.9",
    "platformdirs>=4.3",
    "httpx>=0.27",
    "structlog>=24.4",
    "keyring>=25",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "Pillow>=11",
]
license = [
    # Ed25519 signature verification for meridian.licensing (CONTEXT.md §17).
    # Optional so the host CLI loads even when this is absent — the
    # licensing module degrades to a clear "install meridian[license]" error.
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
meridian = "meridian.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

# Bundle the prompts/ directory inside the wheel as meridian/_prompts/. When a
# user installs the wheel into a venv, there is no repository "prompts/" tree
# alongside; meridian.config.prompts_path falls back to this in-package copy.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "src/meridian/_prompts"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
