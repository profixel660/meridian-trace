[package]
name = "meridian"
version = "0.2.0"
description = "Meridian — AEC project requirements tester desktop shell"
authors = ["Undivided Systems"]
edition = "2021"
rust-version = "1.77"

# Single binary target — entry point in src/main.rs, library logic in src/lib.rs
[[bin]]
name = "meridian"
path = "src/main.rs"

[lib]
name = "meridian_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Default Tauri-2 feature flag — enables custom protocol on release builds so
# the bundled SPA can be loaded via tauri:// instead of needing a localhost server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
