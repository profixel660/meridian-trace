[package]
name = "meridian"
version = "0.2.0"
description = "Meridian — AEC project requirements tester desktop shell"
authors = ["T-Bionic"]
edition = "2021"
rust-version = "1.77"

# Single binary target — entry point in src/main.rs, library logic in src/lib.rs
[[bin]]
name = "meridian"
path = "src/main.rs"

[lib]
name = "meridian_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ROUND-18: PyInstaller will produce
#   src-tauri/binaries/meridian-server-x86_64-pc-windows-msvc.exe
# (the `-<target-triple>` suffix is required by Tauri 2's externalBin lookup).
# `tauri.conf.json` → `bundle.externalBin = ["binaries/meridian-server"]` declares
# the unsuffixed prefix; Tauri appends the host triple at bundle time and
# `Command::sidecar("meridian-server")` resolves to it at runtime.
#
# `tauri-plugin-shell` 2.x re-exports the `Command` / `CommandChild` /
# `CommandEvent` types from `tauri_plugin_shell::process::*` — no extra feature
# flag needed for the spawn surface used in `src/lib.rs`.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Default Tauri-2 feature flag — enables custom protocol on release builds so
# the bundled SPA can be loaded via tauri:// instead of needing a localhost server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
